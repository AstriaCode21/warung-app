<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-primary">

    <div class="container-fluid">

      <span class="navbar-brand">
        Warung App
      </span>

    </div>

  </nav>


  <div class="container py-4">

    <!-- SEARCH -->
    <div class="mb-4">

      <input
        type="text"
        id="search"
        class="form-control form-control-lg"
        placeholder="Cari barang..."
      >

    </div>


    <!-- ROW -->
    <div class="row">

      <!-- BARANG -->
      <div class="col-md-8">

        <div class="row" id="data">

          <div class="text-center">
            Loading...
          </div>

        </div>

      </div>


      <!-- KERANJANG -->
      <div class="col-md-4">

        <div class="card shadow border-0">

          <div class="card-body">

            <h4 class="mb-3">
              Keranjang
            </h4>

            <div id="keranjang">

              Belum ada barang

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- SCRIPT -->
  <script>

  const sheetID = "18ZVwlCXWKbUkF-oepi7jtkmgHD4KpXX5f5gDFvzKlMI";

  const url =
  `https://opensheet.elk.sh/${sheetID}/barang`;

  let barangData = [];

  let keranjang = [];


  fetch(url)
  .then(res => res.json())
  .then(data => {

    barangData = data;

    tampilkanBarang(barangData);

  });


  // TAMPILKAN BARANG

  function tampilkanBarang(data) {

    let html = "";

    data.forEach((item, index) => {

      html += `
      
      <div class="col-md-4 mb-4">

        <div class="card shadow h-100 border-0">

          <div class="card-body">

            <h5 class="fw-bold">
              ${item.nama}
            </h5>

            <h4 class="text-primary">
              Rp ${Number(item.harga).toLocaleString()}
            </h4>

            <p>
              Stok:
              ${item.stok}
            </p>

            <button
              class="btn btn-primary w-100"
              onclick="tambahKeranjang(${index})"
            >
              Tambah
            </button>

          </div>

        </div>

      </div>

      `;

    });

    document.getElementById("data").innerHTML = html;

  }



  // TAMBAH KERANJANG

  function tambahKeranjang(index) {

    const barang = barangData[index];

    const existing =
      keranjang.find(item =>
        item.nama === barang.nama
      );

    if(existing) {

      existing.qty += 1;

    } else {

      keranjang.push({
        nama: barang.nama,
        harga: Number(barang.harga),
        qty: 1
      });

    }

    tampilkanKeranjang();

  }



  // TAMPILKAN KERANJANG

  function tampilkanKeranjang() {

    let html = "";

    let total = 0;

    keranjang.forEach(item => {

      const subtotal =
        item.harga * item.qty;

      total += subtotal;

      html += `
      
      <div class="border-bottom pb-2 mb-2">

        <strong>
          ${item.nama}
        </strong>

        <br>

        ${item.qty} x
        Rp ${item.harga.toLocaleString()}

        <br>

        <strong>
          Rp ${subtotal.toLocaleString()}
        </strong>

      </div>

      `;

    });

    html += `
    
      <hr>

      <h4>
        Total:
        Rp ${total.toLocaleString()}
      </h4>

    `;

    document.getElementById("keranjang")
    .innerHTML = html;

  }



  // SEARCH

  document
  .getElementById("search")
  .addEventListener("input", function() {

    const keyword =
      this.value.toLowerCase();

    const hasil =
      barangData.filter(item =>
        item.nama
        .toLowerCase()
        .includes(keyword)
      );

    tampilkanBarang(hasil);

  });

  </script>


  <!-- BOOTSTRAP -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
