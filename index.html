<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Warung App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container py-4">

  <h1 class="mb-4">
    Warung App
  </h1>

  <!-- Search -->
  <div class="mb-4">
    <input
      type="text"
      id="search"
      class="form-control"
      placeholder="Cari barang..."
    >
  </div>

  <!-- Data Barang -->
  <div class="row" id="data">

    <div class="text-center">
      Loading...
    </div>

  </div>

</div>

<script>

const sheetID = "18ZVwlCXWKbUkF-oepi7jtkmgHD4KpXX5f5gDFvzKlMI";

const url =
`https://opensheet.elk.sh/${sheetID}/barang`;

let barangData = [];

fetch(url)
.then(res => res.json())
.then(data => {

  barangData = data;

  tampilkanBarang(barangData);

});

function tampilkanBarang(data) {

  let html = "";

  data.forEach(item => {

    html += `
      <div class="col-md-4 mb-4">

        <div class="card shadow-sm h-100">

          <div class="card-body">

            <h5 class="card-title">
              ${item.nama}
            </h5>

            <p class="mb-1">
              Harga:
              <strong>
                Rp ${Number(item.harga).toLocaleString()}
              </strong>
            </p>

            <p>
              Stok:
              ${item.stok}
            </p>

            <button
              class="btn btn-primary w-100"
            >
              Tambah
            </button>

          </div>

        </div>

      </div>
    `;

  });

  document.getElementById("data").innerHTML = html;

}

document
.getElementById("search")
.addEventListener("input", function() {

  const keyword =
    this.value.toLowerCase();

  const hasil =
    barangData.filter(item =>
      item.nama
      .toLowerCase()
      .includes(keyword)
    );

  tampilkanBarang(hasil);

});

</script>

</body>
</html>
