<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Warung App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container py-4">

  <h1 class="mb-4">
    Warung App
  </h1>

  <!-- Search -->
  <div class="mb-4">
    <input
      type="text"
      id="search"
      class="form-control"
      placeholder="Cari barang..."
    >
  </div>

  <!-- Data Barang -->
  <div class="row" id="data">

    <div class="text-center">
      Loading...
    </div>

  </div>

</div>

<script>

const sheetID = "18ZVwlCXWKbUkF-oepi7jtkmgHD4KpXX5f5gDFvzKlMI";

const url =
`https://opensheet.elk.sh/${sheetID}/barang`;

let barangData = [];

// KERANJANG
let keranjang = [];

fetch(url)
.then(res => res.json())
.then(data => {

  barangData = data;

  tampilkanBarang(barangData);

});


// ======================
// TAMPILKAN BARANG
// ======================

function tampilkanBarang(data) {

  let html = "";

  data.forEach((item, index) => {

    html += `
    
    <div class="col-md-4 mb-4">

      <div class="card shadow h-100 border-0">

        <div class="card-body">

          <h5 class="card-title fw-bold">
            ${item.nama}
          </h5>

          <p class="mb-1">
            Harga
          </p>

          <h4 class="text-primary">
            Rp ${Number(item.harga).toLocaleString()}
          </h4>

          <p class="mt-3">
            Stok:
            <span class="badge bg-success">
              ${item.stok}
            </span>
          </p>

          <button
            class="btn btn-primary w-100"
            onclick="tambahKeranjang(${index})"
          >
            Tambah
          </button>

        </div>

      </div>

    </div>

    `;

  });

  document.getElementById("data").innerHTML = html;

}



// ======================
// TAMBAH KE KERANJANG
// ======================

function tambahKeranjang(index) {

  const barang = barangData[index];

  // cek apakah barang sudah ada
  const existing =
    keranjang.find(item =>
      item.nama === barang.nama
    );

  if(existing) {

    existing.qty += 1;

  } else {

    keranjang.push({
      nama: barang.nama,
      harga: Number(barang.harga),
      qty: 1
    });

  }

  tampilkanKeranjang();

}



// ======================
// TAMPILKAN KERANJANG
// ======================

function tampilkanKeranjang() {

  let html = "";

  let total = 0;

  keranjang.forEach(item => {

    const subtotal =
      item.harga * item.qty;

    total += subtotal;

    html += `
    
      <div class="border-bottom pb-2 mb-2">

        <strong>
          ${item.nama}
        </strong>

        <br>

        ${item.qty} x
        Rp ${item.harga.toLocaleString()}

        <br>

        <strong>
          Rp ${subtotal.toLocaleString()}
        </strong>

      </div>

    `;

  });

  html += `
  
    <hr>

    <h4>
      Total:
      Rp ${total.toLocaleString()}
    </h4>

  `;

  document.getElementById("keranjang").innerHTML = html;

}



// ======================
// SEARCH
// ======================

document
.getElementById("search")
.addEventListener("input", function() {

  const keyword =
    this.value.toLowerCase();

  const hasil =
    barangData.filter(item =>
      item.nama
      .toLowerCase()
      .includes(keyword)
    );

  tampilkanBarang(hasil);

});

</script>

</body>
</html>
